<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#232A38" stop-opacity="1"/>
      <stop offset="60%" stop-color="#171B24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#111318" stop-opacity="1"/>
    </radialGradient>

    <pattern id="wardTile" width="90" height="90" patternUnits="userSpaceOnUse">
      <!-- faint repeating ward-tooth motif -->
      <g stroke="#C9973E" stroke-opacity="0.06" stroke-width="1.5" fill="none">
        <path d="M20,10 L20,45 A15,15 0 0 1 50,45 L50,10"/>
        <line x1="24" y1="38" x2="24" y2="46"/>
        <line x1="35" y1="38" x2="35" y2="46"/>
        <line x1="46" y1="38" x2="46" y2="46"/>
      </g>
    </pattern>

    <linearGradient id="edgeFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#wardTile)"/>
  <rect width="1600" height="900" fill="url(#edgeFade)"/>

  <!-- single large watermark mark, off-center, very low opacity -->
  <g transform="translate(1120,120) scale(6)" opacity="0.05">
    <path d="M20,52 L20,30 A12,12 0 0 1 44,30 L44,52 Z" fill="none" stroke="#C9973E" stroke-width="1"/>
    <circle cx="32" cy="35" r="4.2" fill="none" stroke="#C9973E" stroke-width="1"/>
  </g>
</svg>
