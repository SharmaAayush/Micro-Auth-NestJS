name: docker-image

# Build and publish the container image to GitHub Container Registry (GHCR)
# on every push to master (covers direct pushes and merge-commit results),
# and on manual dispatch for ad-hoc rebuilds.
#
# Image: ghcr.io/<github.repository> (lowercased by GHCR), e.g.
#        ghcr.io/sharmaaayush/micro-auth-nestjs
#
# Tags produced:
#   - <branch>            (e.g. "master")
#   - sha-<short-sha>     (e.g. "sha-1a2b3c4")
#   - latest              (only on the default branch)
#
# No extra secrets are required: GITHUB_TOKEN is provided automatically and
# the `packages: write` permission below is the minimum needed for GHCR.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # github.repository preserves the case the repo was created with; GHCR
  # normalises the path to lowercase, so this works either way.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
